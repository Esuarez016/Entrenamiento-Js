<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Parcial Enunciado IA 3</title>
</head>

<body>
    <header>
        <h1>Agenda de Contactos</h1>
    </header>

    <section class="primera-seccion">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">

        <label for="telefono">Telefono:</label>
        <input type="text" id="telefono">

        <button id="btnGuardar">Guardar contacto</button>

        <p id="mensaje"></p>
    </section>

    <section class="segunda-seccion">
        <h4>Mostrar Contactos</h4>
        <button id="mostrarContacto">Mostrar contactos</button>
        <div class="contenedor-lista">
            <ul id="lista"></ul>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
