<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Segundo Parcial Recu Programacion Web I</title>
</head>

<body>
    <header>
        <h1>2do Parcial</h1>
    </header>
    <main>
        <section>
            <!-- ARTICULO 1 -->
            <article class="articulo1">
                <p>Título del curso </p>
            </article>
            <!-- ARTICULO 2 -->
            <article>
                <!-- CURSO -->
                <div class="grupo-div">
                    <h4>Seleccioná el curso:</h4>
                    <input type="radio" name="curso" id="html" value="HTML">HTML
                    <input type="radio" name="curso" id="css" value="CSS">CSS
                    <input type="radio" name="curso" id="js" value="JAVASCRIPT">JAVASCRIPT
                </div>
                <!-- COLOR TEXTO -->
                <div class="grupo-div">
                    <h4>Cambiá el color del texto:</h4>
                    <select name="colores-texto" id="colores-texto">
                        <option value="">Seleccione un color</option>
                        <option value="rojo">Rojo</option>
                        <option value="verde">Verde</option>
                        <option value="amarillo">Amarillo</option>
                    </select>
                </div>
                <!-- COLOR FONDO -->
                <div class="grupo-div">
                    <h4>Cambiá el color del fondo: </h4>
                    <input type="radio" name="fondo" id="verde-fondo" value="verde-fondo">verde
                    <input type="radio" name="fondo" id="violeta" value="violeta-fondo">violeta
                    <input type="radio" name="fondo" id="naranja" value="naranja-fondo">naranja
                </div>
            </article>
        </section>
    </main>
    <footer>
        <h2> NOMBRE APELLIDO - DNI</h2>
    </footer>
</body>
<script src="parcial22.js"></script>

</html>
