<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Parcial enunciado IA 2</title>
</head>

<body>
    <header>
        <h1>Lista de Compras</h1>
    </header>

    <section class="primer-contenido">

        <div class="inputs">
            <h4>Producto:</h4>
            <input type="text" id="nombre-producto">

            <button id="btnAgregar">Agregar Producto</button>

            <div class="contenedor-lista">
                <h4 id="mensajeAgregado"></h4>
                <ul id="lista"></ul>
            </div>

        </div>

    </section>

    <h2>Formulario</h2>

    <section class="segundo-contenido">
        <form id="formulario">

            <h4>Nombre:</h4>
            <input type="text" id="nombre">

            <h4>Contraseña:</h4>
            <input type="password" id="contrasenia">

            <h4>Turno:</h4>
            <select id="opciones-turno">
                <option value="">Seleccione un turno</option>
                <option value="mañana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select>

            <button type="submit" id="btnRegistrar">Regristrarse</button>

        </form>

        <p id="mensaje"></p>

    </section>

    <script src="script.js"></script>
</body>

</html>
